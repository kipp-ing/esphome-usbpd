; usbPD firmware — ESP32-C6 + FUSB302 sink
; Build:  BUILD_ID=<id> python -m platformio run -d fw
; BUILD_ID (env var) -> gitignored src/build_id.h via bench/build_id.py (fast rebuild); unset -> "dev". See fw/README.md.

[platformio]
src_dir = src

[env:esp32c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
extra_scripts = pre:../bench/build_id.py
