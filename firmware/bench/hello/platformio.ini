; bench/hello — rig probe firmware (mr-bench). Prints the JSONL boot line with BUILD_ID,
; a heartbeat {"ev":"hb"} every 1 s, and echoes console lines as {"ev":"cmd",...}.
; Build-id contract (same as fw/): env BUILD_ID -> -DBUILD_ID="..." (see bench/README.md).
[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
build_flags =
    '-DBUILD_ID="${sysenv.BUILD_ID}"'
